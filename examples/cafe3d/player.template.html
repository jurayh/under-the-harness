<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='3' fill='%23bc2a18'/%3E%3C/svg%3E">
<title>The Morning Bell — café trace player</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, #faf4e6 0%, #f1e6cf 55%, #e7d7b8 100%);
    font-family: Georgia, 'Times New Roman', serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 18px; top: 16px; z-index: 10;
    color: #3a2a1a; background: rgba(250, 245, 232, 0.88);
    border: 1px solid rgba(74, 52, 35, 0.25); border-radius: 8px;
    padding: 10px 14px 9px; max-width: 470px;
    box-shadow: 0 2px 10px rgba(74, 52, 35, 0.12);
  }
  #caption.warn { border-color: rgba(188, 42, 24, 0.55); }
  #caption.alarm {
    border-color: #bc2a18; background: rgba(253, 238, 234, 0.94);
  }
  #caption .name {
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #6d543a; margin-bottom: 2px;
  }
  #fsTitle { font-size: 17px; font-weight: bold; margin-bottom: 3px; }
  #traceLine { font-size: 15.5px; line-height: 1.35; }
  #caption.alarm #traceLine { color: #8f1f10; }
  #harnessNote {
    font-size: 12.5px; font-style: italic; color: #6d543a;
    margin-top: 4px; line-height: 1.35;
  }
  #transport {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 16px; z-index: 10; width: min(680px, calc(100vw - 36px));
    color: #3a2a1a; background: rgba(250, 245, 232, 0.9);
    border: 1px solid rgba(74, 52, 35, 0.25); border-radius: 8px;
    padding: 9px 14px 10px;
    box-shadow: 0 2px 10px rgba(74, 52, 35, 0.12);
  }
  #transport .row {
    display: flex; align-items: center; gap: 8px;
  }
  #transport .row + .row { margin-top: 8px; }
  #transport button {
    font-family: inherit; font-size: 13.5px; color: #3a2a1a;
    background: #fffdf6; border: 1px solid rgba(74, 52, 35, 0.4);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  #transport button:hover { background: #f4ead2; }
  .fsbtn.active {
    background: #4a3423 !important; color: #faf4e6 !important;
    border-color: #4a3423 !important;
  }
  #scoreLine { font-size: 12.5px; font-style: italic; color: #6d543a; }
  #scrub { flex: 1; accent-color: #4a3423; }
  #stepCount { font-size: 13px; white-space: nowrap; }
  #speed {
    font-family: inherit; font-size: 13px; color: #3a2a1a;
    background: #fffdf6; border: 1px solid rgba(74, 52, 35, 0.4);
    border-radius: 6px; padding: 3px 4px;
  }
  #hint {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    font-size: 12px; color: rgba(74, 52, 35, 0.62); pointer-events: none;
    font-style: italic;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="filmstrips.js"></script>
</head>
<body>
<div id="app"></div>
<div id="caption">
  <div class="name">The Morning Bell — trace player</div>
  <div id="fsTitle">…</div>
  <div id="traceLine">loading the filmstrips…</div>
  <div id="harnessNote"></div>
</div>
<div id="transport">
  <div class="row">
    <button id="btnCareful" class="fsbtn">Careful Tab</button>
    <button id="btnGist" class="fsbtn">Gist Tab</button>
    <span id="scoreLine"></span>
  </div>
  <div class="row">
    <button id="btnPrev" title="previous step (←)">⏮</button>
    <button id="btnPlay" title="play / pause (space)">▶</button>
    <button id="btnNext" title="next step (→)">⏭</button>
    <input type="range" id="scrub" min="0" max="0" step="1" value="0">
    <span id="stepCount"></span>
    <select id="speed" title="playback speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>
</div>
<div id="hint">drag to orbit · scroll to zoom · space to play</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*__SCENE__*/

/*__PLAYER__*/
</script>
</body>
</html>
